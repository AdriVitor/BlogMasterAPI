apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-redis-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      db: redis
  template:
    metadata:
      labels:
        db: redis
    spec:
      containers:
        - name: db-redis-container
          image: redis:latest
          ports:
            - containerPort: 6379 
          volumeMounts:
            - name: db-redis-volume
              mountPath: /data
      volumes:
        - name: db-redis-volume
          persistentVolumeClaim:
            claimName: db-redis-claim

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-redis-claim
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: v1
kind: Service
metadata:
  name: db-redis-service
spec:
  selector:
    db: redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP