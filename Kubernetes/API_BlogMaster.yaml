apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-blogmaster-deployment
spec:
  replicas: 2
  template:
    metadata:
      labels:
        app: api-blogmaster
    spec:
      containers:
        - name: api-blogmaster-container
          image: adrianovitordev/blogmasterapi:1.6
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
            limits:
              cpu: 50m
  selector:
    matchLabels:
      app: api-blogmaster

---
apiVersion: v1
kind: Service
metadata:
  name: api-blogmaster-service
spec:
  selector:
    app: api-blogmaster
  ports:
    - port: 80
      nodePort: 30005
  type: NodePort